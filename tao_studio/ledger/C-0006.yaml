id: C-0006
text: 正反射の経路の近くだけを残して鏡を細くすると、光はまっすぐ反射せず広がってしまう。
origin: 2026-11-13 のチャット（「残った直線の線の面だけを残して光子を反射させても、すべて分散してしまう」）
