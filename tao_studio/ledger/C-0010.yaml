note: 科学史の主張。そのままでは言い過ぎの可能性が高い。立体の幾何学はユークリッド『原論』にあり、地球が球であることは古代ギリシアで論じられていた。地動説（コペルニクス、1543 年）が変えたのは「どこを中心に据えるか」という視点である。「視点を一つ外に出すと、複雑な動きが単純になる」という形に言い直せば、次元を一つ足す話の導入として使える。出典未記入。
