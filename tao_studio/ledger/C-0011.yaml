id: C-0011
text: 単一光子の実験で、経路積分の個々の経路の確率振幅が測定され、ファインマンの二つの公準が検証された。
origin: 2026-11-13 のチャット（共有された論文と紹介記事）
claim_type: FACT
status: unverified
confidence: likely
source_reliability: B
info_credibility: 2
evidence_for:
  - ref: "Yong-Li Wen ほか, Direct experimental test of Feynman's path integral postulates with single photons, Science Advances, doi:10.1126/sciadv.aeh1011（華南師範大学 Shi-Liang Zhu のグループ）"
