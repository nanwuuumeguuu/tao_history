note: 論文本文と紹介記事は開けず、検索結果の要約だけを見た。要約によれば、離散的な格子上の 1,419,857 本の経路について振幅を求め、第一公準を忠実度 94.9%、第二公準を 94.7% で確認。方法は、伝播関数を区間ごとに測り、5 区間の値を掛け合わせて経路全体の振幅を組み立てるもの。つまり「一本ずつの経路を光子が通るのを見た」のではなく、「経路ごとの振幅を測定値から組み立て、その和が理論どおりになることを確かめた」と読める。解説記事の一つは、光子が物理的にすべての経路を通ることを示したわけではないと注記している。C-0003（解釈）の状態は変えない。本文を読んで quote を埋めること。
